# SQA Jira auto-fill defaults for SQA_JIRA workflow.
# Edit this file to change team defaults without rewriting SKILL.md.
# Priority: user override > Atlassian Cloud TC lookup > this file > agent inference from Summary.

project_key: SI91X
issue_type: Bug
# Prepend verbatim at the top of every Description draft/create body AND every
# Jira triage comment body (see SKILL.md → Cursor disclaimer).
triage_comment_disclaimer: >-
  > **Disclaimer:** This triage and proposed PR is Cursor generated. Recommend manual review before accepting this fix.
# Component/s* — always this value on create/update; do not derive from Summary.
component: Bug_Triage_Team
# Reporter* — leave empty so the agent auto-resolves from OS USERNAME via
# jira_get_user_profile. Set a local override only when OS login != Jira username.
reporter_identifier: ""
# IsCrash* — default FALSE. Set TRUE only when Summary mentions crash/fault and
# attached logs contain crash/dump evidence (see SKILL.md IsCrash* section).
is_crash: "FALSE"
# Issue Reproducibility* — always default unless user overrides.
issue_reproducibility: "Easily reproducible"
# Leave blank to force user input when not inferable from Summary or Atlassian TC.
# Affects Version/s and Reported Version come from Summary 2nd bracket [Affects Version] — not from here.
# DEFERRED: Fix Version/s is owned by Dev team after filing — do not ask or set via SQA_JIRA.
# fix_version: ""
requested_version: ""
assignee: ""
labels: []

# Atlassian Cloud test-case lookup (Summary 3rd bracket).
# Example Summary tag: [SW_SQA_TC-11261]
# Browse URL form also accepted and normalized to the issue key.
# TC Repro Steps + Expected Results are read from Cloud — never from Silabs jira-mcp.
atlassian_cloud:
  base_url: "https://siliconlabs.atlassian.net"
  browse_path: "/browse/"
  # Typical test-case project key prefix (informational; accept any KEY-\d+ that resolves on Cloud).
  preferred_tc_project_prefix: "SW_SQA_TC"
  # REST: GET {base_url}/rest/api/3/issue/{key} (summary/labels only — NOT the step table)
  # Auth: Atlassian MCP if enabled; else Basic auth from ~/.cursor/mcp.json `atlassian` server.
  # Never print tokens in chat.
  #
  # Steps source of truth (Xray UI):
  #   Test details → Test Type = "Steps" → columns Action / Data / Expected Result
  # Standard Jira description is often only the TC title; do not treat empty description as no steps.
  # Prefer Xray Cloud API/GraphQL for full steps; else screenshot/paste of the Steps table.

# Map Summary [product-or-device] tag → Jira Product(s)* / Platform Under Test / Labels.
# Product(s)* and Platform Under Test are derived from the first Summary bracket tag.
# Component/s* is NOT taken from this map — always use top-level `component: Bug_Triage_Team`.
# Matching is case-insensitive on the tag; store canonical keys below.
product_device_map:
  # Preferred Summary tags → Product(s)* + Platform Under Test
  SiWx917-Soc:
    products: WiSeConnect-Soc
    platform_under_test: "917 SoC"
    labels: [SiWx917, SoC]
  SiWx917-SoC-Customer-Specific:
    products: WiSeConnect-Soc
    platform_under_test: "Customer Specific"
    labels: [SiWx917, SoC]
  SiWx917-NCP:
    products: WiSeConnect-NCP
    platform_under_test: "917 NCP"
    labels: [SiWx917, NCP]
  SiWx917-RCP:
    products: WiSeConnect-RCP
    platform_under_test: "917 RCP"
    labels: [SiWx917, RCP]
  # Legacy / short tags (ask user to prefer SiWx917-Soc|NCP|RCP when Product(s)* / Platform is ambiguous)
  SiWx917:
    products: ""
    platform_under_test: ""
    labels: [SiWx917]
  SI917:
    products: ""
    platform_under_test: ""
    labels: [SiWx917]
  Si917:
    products: ""
    platform_under_test: ""
    labels: [SiWx917]
  EFR32:
    products: ""
    platform_under_test: ""
    labels: [EFR32]
  NCP:
    products: WiSeConnect-NCP
    platform_under_test: "917 NCP"
    labels: [NCP]
  SoC:
    products: WiSeConnect-Soc
    platform_under_test: "917 SoC"
    labels: [SoC]
  Soc:
    products: WiSeConnect-Soc
    platform_under_test: "917 SoC"
    labels: [SoC]
  RCP:
    products: WiSeConnect-RCP
    platform_under_test: "917 RCP"
    labels: [RCP]

# Optional label enrichment ONLY — Summary 3rd bracket is an Atlassian TC key, not a feature name.
# If the Cloud TC's labels/components/summary contain one of these slugs, add the mapped labels.
# Do not accept these slugs as the Summary 3rd bracket anymore.
feature_label_map:
  scan: [scan]
  bg_scan: [bg_scan, scan]
  connect: [connect]
  ap_mode: [ap_mode]
  at_command: [at_command]
  power_save: [power_save]
  mqtt: [mqtt]
  ble: [ble]

# Optional: harness / report paths used when user does not attach logs.
# Prefer absolute paths on the reporter's machine when known.
evidence_hints:
  pytest_report_dir: ""
  uart_log_dir: ""
  cmds_dir: ""
